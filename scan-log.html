<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan Log</title>
<style>
:root{--bg:#faf9f7;--card:#fff;--ink:#1a1a18;--mut:#6b6b63;--line:#e4e3de;--accent:#8a3b12;--warn:#b4471f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#212125;--ink:#f2f1ee;--mut:#a4a39c;--line:#35353b;--accent:#e0854f;--warn:#e8875f}}
:root[data-theme="dark"]{--bg:#17171a;--card:#212125;--ink:#f2f1ee;--mut:#a4a39c;--line:#35353b;--accent:#e0854f;--warn:#e8875f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:18px;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:19px;margin:0;font-weight:600}
.sub{color:var(--mut);font-size:12.5px;margin-top:3px}
input,select,button,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px}
#code{width:100%;padding:15px 17px;font-size:21px;border-width:2px;border-radius:12px;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#code:focus{outline:none;border-color:var(--accent)}
.hit{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:15px;display:flex;gap:15px;align-items:center;min-height:96px}
.hit img{width:86px;height:86px;object-fit:contain;border-radius:9px;background:#fff;flex-shrink:0}
.nm{font-size:21px;font-weight:600;line-height:1.2}
.sb{color:var(--mut);font-size:13px;margin-top:3px}
.pr{font-size:27px;font-weight:600;margin-top:7px}
.hit.bad{border-left:4px solid var(--warn)}
.idle{color:var(--mut);font-size:14px}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
button{padding:8px 13px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.danger:hover{border-color:var(--warn);color:var(--warn)}
select,input[type=date],input[type=text]{padding:8px 10px;font-size:13px}
#label{width:150px}
.sale{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sale h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:0 0 8px;font-weight:500}
.lines{font-size:14px}
.line{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.line .q{color:var(--mut);font-variant-numeric:tabular-nums}
.line .v{font-variant-numeric:tabular-nums}
.saletot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);margin-top:9px;padding-top:9px}
.saletot span{font-size:13px;color:var(--mut)}
.saletot b{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.big{padding:12px 18px;font-size:15px;font-weight:600;border-color:var(--accent);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:26px;font-weight:600;line-height:1.1}
.kpi span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c{font-family:ui-monospace,monospace;color:var(--mut);font-size:12px;white-space:nowrap}
tr.unk td{color:var(--warn)}
td.act{width:1%;white-space:nowrap;text-align:right}
td.act button{padding:3px 9px;font-size:12px;color:var(--mut);line-height:1.3}
td.act button:hover{border-color:var(--warn);color:var(--warn)}
.thumb{width:34px;height:34px;object-fit:contain;border-radius:5px;background:#fff;vertical-align:middle;margin-right:9px}
.empty{color:var(--mut);padding:22px 0;text-align:center;font-style:italic}
.note{margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--card);
border:1px solid var(--line);border-left:4px solid var(--warn);font-size:13px;color:var(--mut)}
.ask{margin-top:12px;padding:13px 15px;border-radius:10px;background:var(--card);
border:1px solid var(--warn);border-left:4px solid var(--warn);font-size:14px;color:var(--ink)}
.ask .q{white-space:pre-line;margin-bottom:11px}
.ask .bar{margin:0;gap:8px}
.ask button{padding:9px 16px;font-size:14px}
.ask button.yes{border-color:var(--warn);color:var(--warn);font-weight:600}
#panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
#panel h2{font-size:15px;margin:0 0 10px;font-weight:600}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.form input{width:100%;padding:9px 11px;font-size:14px}
.form .wide{grid-column:1/-1}
.prev{display:flex;align-items:center;gap:10px;margin-top:4px}
.prev img{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:7px;border:1px solid var(--line)}
.mine{margin-top:16px;font-size:13px}
.mine .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mine .row img{width:32px;height:32px;object-fit:contain;background:#fff;border-radius:5px}
.mine .row .g{flex:1;min-width:0}
.mine .row .g b{font-weight:600}
.mine .row .g span{display:block;color:var(--mut);font-family:ui-monospace,monospace;font-size:11.5px}
.err{color:var(--warn);font-size:12.5px;margin-top:8px;min-height:16px}
#csvout{width:100%;height:150px;margin-top:10px;padding:10px;font-family:ui-monospace,monospace;
font-size:11.5px;display:none}
.ptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#fSearch{flex:1 1 170px;min-width:0;padding:8px 11px;font-size:13px}
.chkl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);cursor:pointer;white-space:nowrap}
.chkl input{margin:0}
#mine{max-height:390px;overflow-y:auto}
.mine .row.off{opacity:.5}
.mine .row .tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--warn);
border:1px solid var(--warn);border-radius:99px;padding:2px 7px;white-space:nowrap}
.mine .row .nobar{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);
border:1px solid var(--line);border-radius:99px;padding:2px 7px;white-space:nowrap}
.mine .row button{padding:5px 10px;font-size:12px}
.mine .hd{color:var(--mut);margin:12px 0 2px;font-size:12px}
.scope{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--bg);
border:1px solid var(--line);font-size:12.5px;color:var(--mut);line-height:1.5}
.tblwrap{overflow-x:auto}
.scanrow{display:flex;gap:9px;align-items:stretch}
.scanrow #code{flex:1 1 auto;min-width:0;width:auto}
#clr{flex:0 0 auto;padding:0 17px;font-size:14px;color:var(--mut)}
#clr:hover{border-color:var(--warn);color:var(--warn)}
.askp{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.askp .lbl{width:100%;font-size:13px;color:var(--mut);margin-bottom:1px}
.askp button{padding:9px 14px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.askp button.plain{font-weight:400;font-size:13px;color:var(--mut)}
.askp input{width:82px;padding:9px 10px;font-size:15px;text-align:right;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tender{border-top:1px solid var(--line);margin-top:11px;padding-top:11px;display:none}
.tender .hd{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:8px}
.tender .chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tender .chips button{padding:9px 13px;font-size:14px;font-variant-numeric:tabular-nums}
#cash{width:108px;padding:9px 11px;font-size:17px;text-align:right;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.change{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;
font-variant-numeric:tabular-nums}
.change span{font-size:13px;color:var(--mut)}
.change b{font-size:30px;font-weight:600}
.change.short b,.change.short span{color:var(--warn)}
</style></head><body><div class="wrap">

<header>
  <div><h1>Scan log</h1><div class="sub" id="stat"></div></div>
  <div style="display:flex;gap:8px;align-items:center">
    <input type="text" id="label" placeholder="Station name" autocomplete="off">
    <input type="date" id="day">
  </div>
</header>

<div class="scanrow">
  <input id="code" placeholder="Scan a barcode…" autocomplete="off" autofocus>
  <button id="clr" type="button" title="Empty the scan box and reset the panel below">Clear</button>
</div>
<div class="hit" id="out"><div class="idle">Waiting for a scan.</div></div>

<div class="sale">
  <h2>Current customer</h2>
  <div class="lines" id="lines"><div style="color:var(--mut)">Nothing scanned yet.</div></div>
  <div class="saletot"><span id="saleCount">0 items</span><b id="saleTotal">$0.00</b></div>
  <div class="tender" id="tender">
    <div class="hd">Cash received</div>
    <div class="chips">
      <input id="cash" inputmode="decimal" placeholder="0.00" autocomplete="off"
             aria-label="Cash received">
      <button type="button" data-cash="exact">Exact</button>
      <button type="button" data-cash="1">+$1</button>
      <button type="button" data-cash="2">+$2</button>
      <button type="button" data-cash="5">+$5</button>
      <button type="button" data-cash="10">+$10</button>
      <button type="button" data-cash="20">+$20</button>
      <button type="button" id="cashClr" class="danger">Clear</button>
    </div>
    <div class="change" id="changeBox" style="display:none">
      <span id="changeLbl">Change due</span><b id="changeVal">$0.00</b></div>
  </div>
  <div class="bar" style="margin:12px 0 0">
    <button class="big" id="done">Done — next customer</button>
    <button id="undo" class="danger">Undo last scan</button>
    <button id="void" class="danger">Clear customer</button>
  </div>
</div>

<div class="cards">
  <div class="kpi"><b id="kSales">0</b><span>customers</span></div>
  <div class="kpi"><b id="kScans">0</b><span>scans</span></div>
  <div class="kpi"><b id="kTotal">$0.00</b><span>day total</span></div>
</div>

<div class="bar">
  <button onclick="focusInput()">Focus scanner</button>
  <button id="addbtn">Products</button>
  <button id="csv">Export CSV</button>
  <button id="undosale" class="danger">Undo last customer</button>
  <button id="clear" class="danger">Clear this day</button>
</div>

<div id="panel">
  <h2 id="ptitle">Products</h2>
  <div class="ptools">
    <input type="text" id="fSearch" placeholder="Search by name or barcode…" autocomplete="off">
    <label class="chkl"><input type="checkbox" id="fShowHidden"> Show removed</label>
    <button id="fNew">Add a product</button>
    <button id="fExport">Export list</button>
    <button id="fReset" class="danger">Reset this device</button>
    <button id="fClose">Close</button>
  </div>
  <div id="form" style="display:none">
  <div class="form">
    <div><label>Barcode</label><input id="fCode" inputmode="numeric" autocomplete="off" placeholder="scan or type"></div>
    <div><label>Price</label><input id="fPrice" autocomplete="off" placeholder="1.00"></div>
    <div class="wide"><label>Name</label><input id="fName" autocomplete="off" placeholder="Snickers"></div>
    <div class="wide"><label>Size or description (optional)</label><input id="fSub" autocomplete="off" placeholder="Candy bar - 1.86 oz"></div>
    <div class="wide"><label>Photo (optional)</label>
      <div class="prev"><input type="file" id="fPic" accept="image/*" style="border:0;padding:0;font-size:12px">
      <img id="fPrev" style="display:none"></div></div>
  </div>
  <div class="err" id="fErr"></div>
  <div class="bar" style="margin:12px 0 0">
    <button id="fSave">Save product</button>
    <button id="fCancel">Cancel</button>
  </div>
  </div>
  <div class="mine" id="mine"></div>
  <div class="scope" id="scopeNote"></div>
</div>

<div class="tblwrap"><table>
  <thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Price</th>
  <th class="num">Value</th><th>Barcode</th><th>Last scan</th><th></th></tr></thead>
  <tbody id="rows"><tr><td colspan="7" class="empty">No scans yet.</td></tr></tbody>
</table></div>

<textarea id="csvout" readonly></textarea>
<div id="warn"></div>
</div>

let byCode = {}, customs = {}, hidden = {};
const keyOf = d => d.u || ('n:' + d.n);
function rebuild(){
  byCode = {};
  DATA.forEach(d => { if (d.u && !hidden[keyOf(d)]) byCode[d.u] = d; });
  Object.keys(customs).forEach(c => { byCode[c] = customs[c]; });
}
function saveHidden(){ try { localStorage.setItem('hidden', JSON.stringify(hidden)); } catch(e){} }
const $ = id => document.getElementById(id);
const inp = $('code');
let downloads = null, day = localDate(), items = {}, cart = {}, sales = 0, history = [], ok = true;
const BUILD = 'v35 2026-09-22';
/* Unmatched scans are written to the artifact's own store so they can be looked at
   later — it is the only way to see what the scanner actually sent. */
let DB = null;
(async () => { try { DB = await claude.use('db'); } catch(e){ DB = null; } })();
async function recordUnknown(c){
  if (!DB || !c) return;
  try {
    const ref = DB.doc('unknown/' + c);
    const snap = await ref.get();
    const prev = snap.exists ? (snap.data().count || 0) : 0;
    await ref.set({ code: c, count: prev + 1, at: new Date().toISOString(),
                    build: BUILD, products: Object.keys(byCode).length });
  } catch(e){}
}
let upx = {}, cash = 0, lastSale = null;
function saveLast(){
  try {
    if (lastSale) localStorage.setItem('last:'+day, JSON.stringify(lastSale));
    else localStorage.removeItem('last:'+day);
  } catch(e){}
}
function saveUpx(){ try { localStorage.setItem('unk:'+day, JSON.stringify(upx)); } catch(e){} }

function localDate(d){ d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function money(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
function num(p){ const m = /([\d.]+)/.exec(p||''); return m ? parseFloat(m[1]) : 0; }
function upcE(e){
  if(e.length!==8 || (e[0]!=='0' && e[0]!=='1')) return e;
  const S=e[0], d=e.slice(1,7), C=e[7], L=d[5];
  let a;
  if(L==='0'||L==='1'||L==='2') a=S+d.slice(0,2)+L+'0000'+d.slice(2,5);
  else if(L==='3') a=S+d.slice(0,3)+'00000'+d.slice(3,5);
  else if(L==='4') a=S+d.slice(0,4)+'00000'+d[4];
  else a=S+d.slice(0,5)+'0000'+L;
  return a+C;
}
// A scanner that reads only part of a label gives back a few digits.
// If those digits sit inside exactly one barcode on file, that is the product.
function partial(c){
  if (!c || c.length < 4 || c.length >= 12) return null;
  const hits = Object.keys(byCode).filter(u => u.indexOf(c) !== -1);
  return hits.length === 1 ? byCode[hits[0]] : null;
}
function norm(v){ v = (v||'').replace(/\D/g,''); if (v.length===13 && v[0]==='0') v = v.slice(1); if (v.length===8) v = upcE(v); return v; }
function focusInput(){ inp.focus(); }
function esc(s){ const d = document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }
// Safe to drop inside  onclick="f('...')"  — escapes for the JS string first, then the attribute.
function jsq(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function note(m){ $('warn').innerHTML = m ? '<div class="note">'+esc(m)+'</div>' : ''; }

/* An in-page yes/no. The browser's confirm() is silently blocked in some
   webviews — it just returns false, so the button appears dead. */
let askYes = null;
function ask(question, yesLabel, onYes){
  askYes = onYes;
  $('warn').innerHTML =
    '<div class="ask"><div class="q">' + esc(question) + '</div>' +
    '<div class="bar"><button type="button" class="yes" id="askYes">' + esc(yesLabel) + '</button>' +
    '<button type="button" id="askNo">Cancel</button></div></div>';
  $('askYes').onclick = () => { const f = askYes; askYes = null; note(''); if (f) f(); };
  $('askNo').onclick = () => { askYes = null; note(''); focusInput(); };
  $('warn').scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function load(k, dflt){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : dflt; }
  catch(e){ ok = false; return dflt; } }
function saveCart(){ try { localStorage.setItem('cart:'+day, JSON.stringify(cart)); } catch(e){} }
function saveSales(){ try { localStorage.setItem('sales:'+day, String(sales)); } catch(e){} }
function save(){ try { localStorage.setItem('scans:'+day, JSON.stringify(items)); }
  catch(e){ ok = false; note('This browser is blocking local storage, so the log is held in memory only and will be lost if you close the tab. Export before you finish.'); } }

$('day').value = day;
$('label').value = (function(){ try { return localStorage.getItem('label')||''; } catch(e){ return ''; } })();
$('label').addEventListener('change', () => { try { localStorage.setItem('label', $('label').value); } catch(e){} });

function onScan(raw){
  const c = norm(raw); inp.value = '';
  if (!c) return;
  const part = byCode[c] ? null : partial(c);
  const d = byCode[c] || part, now = new Date().toISOString();
  if (!d) recordUnknown(c);
  const off = d ? null : DATA.find(x => x.u === c && hidden[keyOf(x)]);
  const label = d ? d.n : (off ? off.n + ' (removed)' : 'Unknown item');
  const key = part ? part.u : c;
  const r = cart[key] || (cart[key] = {n: label, p: d ? d.p : (upx[c] || ''), q: 0, last: now, unk: !d});
  if (!d && !r.p && upx[c]) r.p = upx[c];
  r.q += 1; r.last = now;
  history.push(key);
  showHit(d, c, part ? c : null); saveCart(); renderCart();
}
// Price buttons shown under an unpriced scan. `suggest` is the product's old price, if we know one.
function askPrice(c, suggest){
  const q = jsq(c);
  if (upx[c])
    return '<div class="askp"><span class="lbl">Ringing at <b>'+esc(upx[c])+
      '</b> — set earlier today.</span>' +
      '<button class="plain" onclick="clearUnk(\''+q+'\')">Change price</button></div>';
  const chips = [];
  const sv = num(suggest);
  if (sv) chips.push(sv);
  [1, 1.5].forEach(v => { if (!chips.includes(v)) chips.push(v); });
  return '<div class="askp"><span class="lbl">What did it ring for?</span>' +
    chips.map(v => '<button onclick="setUnk(\''+q+'\','+v+')">$'+v.toFixed(2)+'</button>').join('') +
    '<input id="upxin" inputmode="decimal" placeholder="0.00" autocomplete="off" ' +
    'onkeydown="if(event.key===\'Enter\'){event.preventDefault();setUnkTyped(\''+q+'\')}">' +
    '<button class="plain" onclick="setUnkTyped(\''+q+'\')">Set</button>' +
    '<button class="plain" onclick="focusInput()">Skip</button></div>';
}
function setUnk(c, v){
  upx[c] = '$' + (+v).toFixed(2);
  saveUpx();
  if (cart[c]) cart[c].p = upx[c];
  if (items[c] && !items[c].p) { items[c].p = upx[c]; save(); }
  renderCart(); render(); showHit(byCode[c], c); focusInput();
}
function setUnkTyped(c){
  const el = $('upxin'), v = (el ? el.value : '').trim().replace(/^\$/,'');
  if (!/^\d+(\.\d{1,2})?$/.test(v)){
    note('Type a price like 1.25, or tap one of the buttons.'); if (el) el.focus(); return;
  }
  note(''); setUnk(c, parseFloat(v));
}
function clearUnk(c){ delete upx[c]; saveUpx(); showHit(byCode[c], c); }

function showHit(d, c, fragment){
  const o = $('out');
  if (d){ o.className = 'hit';
    o.innerHTML = (d.i ? '<img src="'+d.i+'" alt="">' : '') +
      '<div><div class="nm">'+esc(d.n)+'</div><div class="sb">'+esc(d.s)+'</div><div class="pr">'+esc(d.p)+'</div>' +
      (fragment ? '<div class="sb" style="color:var(--warn)">Short read \u2014 the scanner returned ' +
        esc(fragment) + ', which only matches this one product. Rang up anyway.</div>' : '') +
      '</div>';
  } else { o.className = 'hit bad';
    const off = DATA.find(x => x.u === c && hidden[keyOf(x)]);
    o.innerHTML = off
      ? '<div><div class="nm">'+esc(off.n)+' — removed</div>'+
        '<div class="sb">This product was removed from the catalogue on this device, so it rang up as unknown. It is still counted.</div>'+
        '<div class="pr" style="font-size:19px;font-family:ui-monospace,monospace">'+esc(c)+'</div>'+
        askPrice(c, off.p) +
        '<button style="margin-top:8px" onclick="restoreProduct(\''+jsq(keyOf(off))+'\')">Put it back</button></div>'
      : '<div><div class="nm">Not in catalogue</div><div class="sb">Counted anyway so the day still balances.' +
        (Object.keys(hidden).length || Object.keys(customs).length
          ? ' This device has products switched off or added — open Products and use Reset this device if that is unexpected.'
          : '') + '</div>'+
        '<div class="pr" style="font-size:19px;font-family:ui-monospace,monospace">'+esc(c)+'</div>'+
        askPrice(c, '') +
        '<button style="margin-top:8px" onclick="openForm(\''+jsq(c)+'\')">Add this product</button></div>'; }
}
inp.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); onScan(inp.value); }});
function clearScan(){
  inp.value = '';
  $('out').className = 'hit';

}
$('clr').onclick = clearScan;
inp.addEventListener('keydown', e => { if (e.key==='Escape'){ e.preventDefault(); clearScan(); }});
document.addEventListener('click', e => { if (!e.target.closest('button,input,select,textarea')) focusInput(); });

function render(){
  const codes = Object.keys(items).sort((a,b) => items[b].last.localeCompare(items[a].last));
  let scans = 0, total = 0;
  codes.forEach(c => { scans += items[c].q; total += items[c].q * num(items[c].p); });
  $('kScans').textContent = scans; $('kSales').textContent = sales; $('kTotal').textContent = money(total);
  if (!codes.length){ $('rows').innerHTML = '<tr><td colspan="7" class="empty">No scans yet on '+esc(day)+'.</td></tr>';
    window.__rows = []; return; }
  const rows = [];
  $('rows').innerHTML = codes.map(c => {
    const a = items[c], d = byCode[c], v = a.q * num(a.p);
    rows.push({code:c, name:a.n, qty:a.q, price:a.p, value:v, last:a.last});
    return '<tr class="'+(a.unk?'unk':'')+'"><td><div style="display:flex;align-items:center">'+
      (d && d.i ? '<img class="thumb" src="'+d.i+'">' : '') + esc(a.n) + '</div></td>'+
      '<td class="num">'+a.q+'</td><td class="num">'+esc(a.p||'—')+'</td>'+
      '<td class="num">'+(v?money(v):'—')+'</td><td class="c">'+esc(c)+'</td>'+
      '<td class="c">'+new Date(a.last).toLocaleTimeString()+'</td>'+
      '<td class="act"><button type="button" onclick="dropRow(\''+jsq(c)+'\')" '+
      'title="Remove this line from the day">Remove</button></td></tr>';
  }).join('');

}

$('day').addEventListener('change', () => {
  day = $('day').value || localDate();
  items = load('scans:'+day, {}); cart = load('cart:'+day, {}); upx = load('unk:'+day, {});
  lastSale = load('last:'+day, null);
  sales = +(function(){ try { return localStorage.getItem('sales:'+day) || 0; } catch(e){ return 0; } })();
  history = []; setCash(0); renderCart(); renderUndo();
  $('csvout').style.display = 'none'; note(''); render();
});
$('undo').onclick = () => {
  const c = history.pop();
  if (!c || !cart[c]){ note('Nothing left to undo for this customer. Once a customer is closed out, use Clear this day.'); return; }
  cart[c].q -= 1; if (cart[c].q <= 0) delete cart[c];
  note(''); saveCart(); renderCart();
};
$('clear').onclick = () => ask(
  'Delete every scan recorded on ' + day + ' on this device, including the open sale?',
  'Clear the day', () => {
  items = {}; cart = {}; sales = 0; history = []; upx = {}; lastSale = null;
  try { localStorage.removeItem('scans:'+day); localStorage.removeItem('cart:'+day);
        localStorage.removeItem('sales:'+day); localStorage.removeItem('unk:'+day);
        localStorage.removeItem('last:'+day); } catch(e){}
  setCash(0); renderCart(); renderUndo();
  $('csvout').style.display = 'none'; note(''); render();
  focusInput();
});
function renderUndo(){
  const b = $('undosale');
  b.disabled = !lastSale;
  b.style.opacity = lastSale ? '' : '.5';
  b.title = lastSale
    ? 'Take back the customer you just closed out'
    : 'Nothing to take back — no customer has been closed out on this device since the page was opened';
}
$('undosale').onclick = () => {
  if (!lastSale){ note('Nothing to take back. The last closed-out customer can be undone until another one is closed.'); return; }
  const n = lastSale.lines.reduce((a, l) => a + l.q, 0);
  ask('Take back the last customer (' + n + (n === 1 ? ' item' : ' items') + ')?\n' +
      'It comes off the day\'s totals and the customer count.',
      'Take it back', () => {
  lastSale.lines.forEach(l => {
    const d = items[l.c];
    if (!d) return;
    d.q -= l.q;
    if (d.q <= 0) delete items[l.c];
  });
  sales = Math.max(0, sales - 1);
  lastSale = null;
  save(); saveSales(); saveLast();
  render(); renderUndo();
  note('Last customer taken back.');
  focusInput();
  });
};
function dropRow(c){
  const a = items[c];
  if (!a) return;
  ask('Remove ' + a.q + ' x ' + a.n + ' from ' + day + '?\nThe customer count is not changed.',
      'Remove it', () => {
  delete items[c];
  if (lastSale){
    lastSale.lines = lastSale.lines.filter(l => l.c !== c);
    if (!lastSale.lines.length) lastSale = null;
    saveLast();
  }
  save(); render(); renderUndo();
  note('Removed ' + a.n + ' from the day.');
  });
}
$('csv').onclick = async () => {
  const rows = window.__rows || [];
  if (!rows.length){ note('Nothing to export yet.'); return; }
  const q = s => '"' + String(s==null?'':s).replace(/"/g,'""') + '"';
  const st = $('label').value || 'station';
  const csv = 'Date,Station,Customers,Barcode,Product,Quantity,Unit price,Value,Last scan\n' +
    rows.map(r => [q(day), q(st), sales, q(r.code), q(r.name), r.qty, q(r.price),
      r.value ? r.value.toFixed(2) : '', q(new Date(r.last).toLocaleString())].join(',')).join('\n');
  const name = 'scans-' + day + (st !== 'station' ? '-' + st.replace(/[^A-Za-z0-9_-]/g,'') : '') + '.csv';
  if (downloads){
    try { await downloads.save({filename: name, data: csv}); return; } catch(e){}
  }
  const t = $('csvout'); t.value = csv; t.style.display = 'block'; t.select();
  try { await navigator.clipboard.writeText(csv);
        note('Copied to the clipboard. Paste it into a spreadsheet.'); }
  catch(e){ note('Select the text below and copy it into a spreadsheet.'); }
};


// ---------- current sale ----------
function cartTotals(){
  let n = 0, v = 0;
  Object.keys(cart).forEach(c => { n += cart[c].q; v += cart[c].q * num(cart[c].p); });
  return {n: n, v: v};
}
function money2(n){ return '$' + (Math.round(Math.abs(n)*100)/100).toFixed(2); }
function setCash(v){ cash = Math.max(0, Math.round(v*100)/100);
  $('cash').value = cash ? cash.toFixed(2) : ''; renderChange(); }
function renderChange(){
  const t = cartTotals(), box = $('changeBox');
  if (!cash){ box.style.display = 'none'; return; }
  const diff = Math.round((cash - t.v) * 100) / 100;
  box.style.display = 'flex';
  box.className = 'change' + (diff < 0 ? ' short' : '');
  $('changeLbl').textContent = diff < 0 ? 'Still owed' : 'Change due';
  $('changeVal').textContent = money2(diff);
}
$('cash').addEventListener('input', () => {
  const v = parseFloat($('cash').value.replace(/[^\d.]/g,''));
  cash = isNaN(v) ? 0 : Math.max(0, Math.round(v*100)/100);
  renderChange();
});
$('cashClr').onclick = () => { setCash(0); focusInput(); };
document.querySelectorAll('[data-cash]').forEach(b => {
  b.onclick = () => {
    const k = b.getAttribute('data-cash');
    setCash(k === 'exact' ? cartTotals().v : cash + parseFloat(k));
  };
});

function renderCart(){
  const codes = Object.keys(cart).sort((a,b) => cart[b].last.localeCompare(cart[a].last));
  const t = cartTotals();
  $('tender').style.display = codes.length ? 'block' : 'none';
  if (!codes.length && cash) setCash(0); else renderChange();
  $('saleCount').textContent = t.n + (t.n === 1 ? ' item' : ' items');
  $('saleTotal').textContent = money(t.v);
  $('lines').innerHTML = codes.length
    ? codes.map(c => {
        const r = cart[c], v = r.q * num(r.p);
        return '<div class="line"><div><span class="q">' + r.q + ' x </span>' + esc(r.n) +
          (r.unk ? ' <span style="color:var(--warn)">(unknown)</span>' : '') +
          '</div><div class="v">' + (v ? money(v) : '—') + '</div></div>';
      }).join('')
    : '<div style="color:var(--mut)">Nothing scanned yet.</div>';
}
$('done').onclick = () => {
  const codes = Object.keys(cart);
  if (!codes.length){ note('Nothing to close out — scan something first.'); return; }
  const t = cartTotals();
  const tendered = cash, change = Math.round((cash - t.v) * 100) / 100;
  const unpriced = codes.filter(c => !num(cart[c].p));
  if (tendered && change < 0){
    ask('Cash received is ' + money(tendered) + ' but the sale comes to ' + money(t.v) +
        ' \u2014 ' + money2(change) + ' short.\nClose this customer out anyway?',
        'Close it out', closeOut);
    return;
  }
  if (unpriced.length){
    ask(unpriced.length + (unpriced.length === 1 ? ' item has' : ' items have') +
        ' no price, so ' + (unpriced.length === 1 ? 'it adds' : 'they add') +
        ' nothing to the total.\nClose this customer out anyway?',
        'Close it out', closeOut);
    return;
  }
  closeOut();
  function closeOut(){
  codes.forEach(c => {
    const r = cart[c];
    const d = items[c] || (items[c] = {n: r.n, p: r.p, q: 0, last: r.last, unk: r.unk});
    d.q += r.q;
    if (r.last > d.last) d.last = r.last;
  });
  // Keep the closed-out customer around so it can be taken back if it was a mistake.
  lastSale = { lines: codes.map(c => ({ c: c, q: cart[c].q })), at: new Date().toISOString() };
  sales += 1;
  cart = {}; history = [];
  setCash(0);
  save(); saveSales(); saveCart(); saveLast();
  renderCart(); render(); renderUndo();
  const o = $('out');
  o.className = 'hit';
  o.innerHTML = '<div><div class="nm">' + money(t.v) + '</div><div class="sb">' +
    t.n + (t.n === 1 ? ' item' : ' items') + ' rung up. Ready for the next customer.</div>' +
    (tendered ? '<div class="pr" style="font-size:20px">' +
                (change < 0 ? money2(change) + ' still owed' : money(change) + ' change') +
                '<span style="font-size:13px;color:var(--mut)"> from ' + money(tendered) +
                '</span></div>' : '') + '</div>';
  note('');
  focusInput();
  }
};
$('void').onclick = () => {
  const n = cartTotals().n;
  if (!n){ note('Nothing to clear — this customer has no scans yet.'); return; }
  const wipe = () => {
    cart = {}; history = [];
    setCash(0);
    saveCart(); renderCart(); note('');
    $('out').className = 'hit';
    $('out').innerHTML = '<div class="idle">Customer cleared. Waiting for a scan.</div>';
    focusInput();
  };
  // One item is cheap to rescan; a built-up sale is not, so that one asks first.
  if (n > 1) ask('Clear this customer\'s ' + n + ' items?\nThe day\'s totals are not affected.',
                 'Clear customer', wipe);
  else wipe();
};

let pic = null, editing = null;
function openForm(code){
  $('panel').style.display = 'block';
  $('form').style.display = 'block';
  editing = null; pic = null;
  $('fPrev').style.display = 'none'; $('fPic').value = ''; $('fErr').textContent = '';
  const c = customs[code];

  $('fName').value = c ? c.n : '';
  $('fSub').value  = c ? c.s : '';

  if (c) editing = code;
  $('panel').scrollIntoView({behavior:'smooth', block:'nearest'});
  ($('fCode').value ? $('fName') : $('fCode')).focus();
}
function closeForm(){ $('form').style.display = 'none'; $('fErr').textContent = ''; focusInput(); }
function closePanel(){ $('panel').style.display = 'none'; closeForm(); }
function openPanel(){ $('panel').style.display = 'block'; renderProducts();
  $('panel').scrollIntoView({behavior:'smooth', block:'nearest'}); }
$('addbtn').onclick = () => { $('panel').style.display === 'block' ? closePanel() : openPanel(); };
$('fClose').onclick = closePanel;
$('fNew').onclick = () => openForm('');
$('fCancel').onclick = closeForm;
$('fSearch').addEventListener('input', renderProducts);
$('fShowHidden').addEventListener('change', renderProducts);

$('fPic').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const B = 220, cv = document.createElement('canvas');
      cv.width = B; cv.height = B;
      const x = cv.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0,0,B,B);
      const r = Math.min(B/im.width, B/im.height), w = im.width*r, h = im.height*r;
      x.drawImage(im, (B-w)/2, (B-h)/2, w, h);
      pic = cv.toDataURL('image/jpeg', 0.7);
      $('fPrev').src = pic; $('fPrev').style.display = 'block';
    };
    im.onerror = () => { $('fErr').textContent = 'That file could not be read as an image.'; };
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
});

function checkDigit(c){
  if (c.length !== 12) return null;
  let odd = 0, even = 0;
  for (let i = 0; i < 11; i++){ const d = +c[i]; (i % 2 === 0) ? odd += d : even += d; }
  return (10 - ((odd*3 + even) % 10)) % 10 === +c[11];
}

$('fSave').onclick = () => {
  const code = norm($('fCode').value);
  const name = $('fName').value.trim();
  let price = $('fPrice').value.trim().replace(/^\$/,'');
  if (!code){ $('fErr').textContent = 'A barcode is required — scan the product into the box above, or type its digits.'; return; }
  if (!name){ $('fErr').textContent = 'A product name is required.'; return; }
  if (price && !/^\d+(\.\d{1,2})?$/.test(price)){ $('fErr').textContent = 'Price should be a number like 1.50.'; return; }
  const builtin = DATA.find(d => d.u === code);
  if (builtin && !customs[code]){
    ask('That barcode already belongs to "' + builtin.n + '". Save anyway and override it?',
        'Override it', saveIt);
    return;
  }
  saveIt();
  function saveIt(){
  if (editing && editing !== code) delete customs[editing];
  customs[code] = {n: name, s: $('fSub').value.trim(), p: price ? '$' + (+price).toFixed(2) : '', u: code, i: pic, mine: true};
  try { localStorage.setItem('products', JSON.stringify(customs)); }
  catch(e){ $('fErr').textContent = 'Could not save — this device is out of storage space. Try a product without a photo.';
            delete customs[code]; return; }
  rebuild(); stat(); renderProducts(); render();
  const valid = checkDigit(code);
  $('fErr').textContent = '';
  closeForm();
  note('Saved "' + name + '".' + (valid === false ? ' Note: that barcode fails its own check digit, so a scanner may read it differently.' : ''));
  }
};

function row(p, k, mine){
  const off = !mine && hidden[k];
  return '<div class="row'+(off?' off':'')+'">' + (p.i ? '<img src="'+p.i+'">' : '') +
    '<div class="g"><b>'+esc(p.n)+'</b><span>'+(p.u ? esc(p.u) : 'no barcode')+(p.p?' · '+esc(p.p):'')+'</span></div>' +
    (off ? '<span class="tag">removed</span>' : (!p.u ? '<span class="nobar">no barcode</span>' : '')) +
    (mine ? '<button onclick="openForm(\''+jsq(k)+'\')">Edit</button>' +
            '<button class="danger" onclick="delProduct(\''+jsq(k)+'\')">Delete</button>'
          : (off ? '<button onclick="restoreProduct(\''+jsq(k)+'\')">Put back</button>'
                 : '<button class="danger" onclick="hideProduct(\''+jsq(k)+'\')">Remove</button>')) +
    '</div>';
}
function renderProducts(){
  const q = ($('fSearch') ? $('fSearch').value : '').trim().toLowerCase();
  const showOff = $('fShowHidden') && $('fShowHidden').checked;
  const match = p => !q || p.n.toLowerCase().includes(q) || (p.u||'').includes(q);
  const mineCodes = Object.keys(customs).filter(c => match(customs[c]))
    .sort((a,b) => customs[a].n.localeCompare(customs[b].n));
  const cat = DATA.filter(d => match(d) && (showOff || !hidden[keyOf(d)]));
  const nOff = DATA.filter(d => hidden[keyOf(d)]).length;
  let html = '';
  if (mineCodes.length)
    html += '<div class="hd">Added by you (' + mineCodes.length + ')</div>' +
            mineCodes.map(c => row(customs[c], c, true)).join('');
  html += '<div class="hd">Catalogue (' + cat.length +
          (nOff && !showOff ? ' shown, ' + nOff + ' removed' : '') + ')</div>';
  html += cat.length ? cat.map(d => row(d, keyOf(d), false)).join('')
                     : '<div class="row" style="color:var(--mut)">Nothing matches that search.</div>';
  $('mine').innerHTML = html;
  $('scopeNote').textContent = 'Adding and removing products changes this device only — the printed tags and ' +
    'the other stations are not affected. Export the list to carry the changes elsewhere.';
}
function hideProduct(k){
  const d = DATA.find(x => keyOf(x) === k);
  if (!d) return;
  ask('Remove "' + d.n + '" from the catalogue on this device?\n' +
      'It will stop ringing up, but scans already recorded keep their name, and you can put it back.',
      'Remove it', () => {
    hidden[k] = 1; saveHidden(); rebuild(); stat(); renderProducts(); render();
    note('Removed "' + d.n + '" on this device. Open Products and tick "Show removed" to put it back.');
  });
}
function restoreProduct(k){
  const d = DATA.find(x => keyOf(x) === k);
  delete hidden[k]; saveHidden(); rebuild(); stat(); renderProducts(); render();
  if (d) note('"' + d.n + '" is back in the catalogue.');
}
function delProduct(c){
  ask('Delete "' + customs[c].n + '"? Scans already recorded keep their name.', 'Delete it', () => {
    delete customs[c];
    try { localStorage.setItem('products', JSON.stringify(customs)); } catch(e){}
    rebuild(); stat(); renderProducts();
  });
}
$('fReset').onclick = () => {
  const off = DATA.filter(d => hidden[keyOf(d)]).length, mine = Object.keys(customs).length;
  if (!off && !mine){ note('Nothing to reset — no products have been added or removed on this device.'); return; }
  ask('Put back ' + off + ' removed product' + (off === 1 ? '' : 's') +
      ' and delete ' + mine + ' added by you?\nScans already recorded are not affected.',
      'Reset it', () => {
    hidden = {}; customs = {};
    try { localStorage.removeItem('hidden'); localStorage.removeItem('products'); } catch(e){}
    rebuild(); stat(); renderProducts(); render();
    note('This device is back to the printed catalogue — ' + Object.keys(byCode).length + ' products.');
  });
};
$('fExport').onclick = async () => {
  const q = s => '"' + String(s==null?'':s).replace(/"/g,'""') + '"';
  const lines = [];
  DATA.forEach(d => lines.push([q(d.n), q(d.s), q(d.p), q(d.u||''),
    hidden[keyOf(d)] ? 'removed' : 'active', 'catalogue'].join(',')));
  Object.keys(customs).forEach(c => { const p = customs[c];
    lines.push([q(p.n), q(p.s), q(p.p), q(c), 'active', 'added here'].join(',')); });
  const csv = 'Product,Description,Price,Barcode,Status,Source\n' + lines.join('\n');
  if (downloads){ try { await downloads.save({filename:'products.csv', data:csv}); return; } catch(e){} }
  const t = $('csvout'); t.value = csv; t.style.display = 'block'; t.select();
  try { await navigator.clipboard.writeText(csv); note('Product list copied to the clipboard.'); }
  catch(e){ note('Select the text below and copy it.'); }
};

customs = load('products', {});
hidden  = load('hidden', {});
rebuild();
items = load('scans:'+day, {});
cart  = load('cart:'+day, {});
upx   = load('unk:'+day, {});
lastSale = load('last:'+day, null);
sales = +(function(){ try { return localStorage.getItem('sales:'+day) || 0; } catch(e){ return 0; } })();
render(); renderCart(); renderProducts(); renderUndo(); focusInput();
function stat(){
  const n = Object.keys(byCode).length;
  const mine = Object.keys(customs).length;
  const off = DATA.filter(d => hidden[keyOf(d)]).length;
  const bits = [];
  if (mine) bits.push(mine + ' added by you');
  if (off) bits.push(off + ' removed');
  $('stat').textContent = 'Saved on this device. ' + n + ' products have a barcode on file' +
    (bits.length ? ' (' + bits.join(', ') + ')' : '') + ' \u00b7 ' + BUILD;
}
stat();
if (!ok) note('This browser is blocking local storage, so scans will not survive a reload. Export before you finish.');
(async () => { try { downloads = await claude.use('downloads'); } catch(e){ downloads = null; } })();
</script></body></html>
